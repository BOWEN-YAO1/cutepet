name: Build and verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build CutePet.sln -c Release
      - run: dotnet run --project tests/CutePet.Tests -c Release --no-build
      - name: Verify WPF states without an account or visible desktop window
        run: |
          dotnet src/CutePet.Desktop/bin/Release/net8.0-windows/CutePet.dll --verify artifacts/desktop-verification
          $taskVerificationExit = $LASTEXITCODE
          $taskReportPath = 'artifacts/desktop-verification/verification.json'
          if (Test-Path -LiteralPath $taskReportPath) {
            $taskReport = Get-Content -LiteralPath $taskReportPath -Raw | ConvertFrom-Json
            Write-Output "WPF verification: passed=$($taskReport.passed), checks=$($taskReport.checks.Count)"
            if (-not $taskReport.passed) { Write-Output $taskReport.failure }
          }
          exit $taskVerificationExit
      - name: Package and verify grouped desktop distribution
        run: |
          dotnet publish src/CutePet.Desktop -c Release --no-build -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-desktop.py --publish-dir artifacts/publish --verification-dir artifacts/desktop-verification --output-dir artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskPackage = Get-ChildItem -LiteralPath artifacts/packages -Filter 'CutePet-Desktop-*-win-x64.zip' | Select-Object -First 1
          $taskCommit = git rev-parse HEAD
          python scripts/verify-package.py $taskPackage.FullName --expected-commit $taskCommit
          exit $LASTEXITCODE
